<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>qsPlus</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="qsPlus.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Theme functions
        window.isDarkTheme = function() {
            return document.documentElement.classList.contains('dark-theme');
        }
        
        window.setTheme = function(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme');
                localStorage.setItem('theme', 'dark');
                
                // For MAUI integration
                try {
                    if (window.JSInterop && window.JSInterop.setAppTheme) {
                        window.JSInterop.setAppTheme('dark');
                    }
                } catch (e) {
                    console.error('Failed to set native theme:', e);
                }
            } else {
                document.documentElement.classList.remove('dark-theme');
                localStorage.setItem('theme', 'light');
                
                // For MAUI integration
                try {
                    if (window.JSInterop && window.JSInterop.setAppTheme) {
                        window.JSInterop.setAppTheme('light');
                    }
                } catch (e) {
                    console.error('Failed to set native theme:', e);
                }
            }
        }
        
        // Check for saved theme preference or prefer-color-scheme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            window.setTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            window.setTheme('dark');
        }
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
